<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>网页审美 · 从参考到判断</title><link rel="stylesheet" href="./web-aesthetic.css"><link rel="stylesheet" href="./document-reader.css"></head>
<body><header class="topbar"><a href="./index.html" class="brand"><img src="./brand.png" alt="rainbow鱼"><span>视觉方法库 <b>/ WEB DIRECTION</b></span></a><nav><a href="../studies/jiangou-ui.md">参考研究 ↗</a><a href="../guides/web-aesthetic-direction.md">如何做判断 ↗</a></nav></header>
<main><section class="study-heading"><div><p class="eyebrow">同一份内容 / 三种网页结构</p><h1>审美，从选择开始。</h1></div><p>先看什么，接着读什么，最后做什么。<br>比较整页的秩序，而不只是几种颜色。</p></section>
<div class="directions" role="group" aria-label="选择网页方向" id="directions"></div>
<div class="workspace-bar"><span id="directionHint"></span><div><button id="compact" aria-pressed="false">窄屏预览</button><button id="reduce" aria-pressed="false">减少动态效果</button><button id="brief">查看设计约定</button></div></div>
<details class="content-controls"><summary>编辑内容与选用理由</summary><div><label>页面标题<input id="pageTitle" maxlength="180" autocomplete="off" aria-label="页面标题"></label><label>我选择这套设计的理由<textarea id="rationale" rows="2" maxlength="1000" placeholder="例如：先让人理解一个问题，再浏览其余研究。" aria-label="选用理由"></textarea></label></div></details>
<div class="preview-shell"><div id="viewport" class="preview-host"><section id="page" class="world-page" aria-label="原创网页预览"></section></div></div>
<section class="decision-row"><article><span class="eyebrow">适合什么</span><p id="appropriate"></p></article><article><span class="eyebrow">为什么这样排</span><p id="reason"></p></article><article><span class="eyebrow">你会放弃什么</span><p id="tradeoff"></p></article></section>
<div class="export-row"><p>三套页面共用项目、标题、搜索和收藏。<br><span>这是独立设计样例，不连接现有视频工程。</span></p><div><button id="exportJson" class="primary">导出设计 JSON</button><button id="exportCss">导出配色与排版 CSS</button><a href="../examples/web-aesthetic/API.md">代码与接口 ↗</a></div></div><p id="message" class="message" role="status" aria-live="polite"></p>
</main><footer><span>原创页面与程序化插画 · 参考入口：见构 UI</span><a href="https://www.douyin.com/video/7699773577990228857" target="_blank" rel="noopener">查看原作品 ↗</a></footer>
<dialog id="projectDialog" class="project-dialog" aria-labelledby="projectDialogTitle"><div class="dialog-top"><span>研究卡片 / 原创示例</span><button id="closeProject" aria-label="关闭研究卡片">关闭 ×</button></div><div id="projectDetail"></div></dialog>
<dialog id="briefDialog" class="brief-dialog" aria-labelledby="briefTitle"><div class="dialog-top"><div><p class="eyebrow">把判断交给下一次制作</p><h2 id="briefTitle">这套网页的设计约定</h2></div><button id="closeBrief" aria-label="关闭设计约定">关闭 ×</button></div><p class="brief-note">包含用途、内容顺序、取舍与状态要求。它是可改写的制作输入，不是万能提示词。</p><textarea id="promptText" readonly aria-label="可复用设计提示词"></textarea><div class="brief-actions"><button id="copyBrief" class="primary">复制设计约定</button><button id="downloadBrief">下载文本</button><p id="copyStatus" role="status"></p></div></dialog>
<script type="module" src="./web-aesthetic-studio.js"></script><script type="module" src="./document-reader.js"></script></body></html>
