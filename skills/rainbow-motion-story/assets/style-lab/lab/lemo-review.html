<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lemo 试作检查</title><style>body{margin:24px;background:#e9e9de;color:#263936;font:14px "Microsoft YaHei",sans-serif}a{color:#315d50;margin-right:20px}section{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 24px}canvas{width:100%;display:block}h2{font-size:16px;font-weight:500}p{font-size:11px}#diagnostics{white-space:pre-wrap}nav{margin-bottom:20px}</style></head><body><nav><a href="./lemo-atlas.html">返回风格图谱</a><a href="?group=0">1—4</a><a href="?group=1">5—8</a><a href="?group=2">9—12</a><a href="?group=3">13—14</a><a id="report" download="lemo-render-qa.json">下载检查记录</a></nav><div id="diagnostics">检查中…</div><main></main><script type="module">
import{trials,draw,sample}from'./modules/lemo-trials.js';
const output={trials:trials.length,rendered:0,deterministic:[],errors:[],coverage:'Canvas output and absolute-time pixels; not physical accuracy or audio approval'};
const c=document.createElement('canvas');c.width=640;c.height=360;const ctx=c.getContext('2d',{willReadFrequently:true});
function pixels(id,t){draw(ctx,t,640,360,{id});const d=ctx.getImageData(0,0,640,360).data;let h=2166136261;for(let i=0;i<d.length;i++)h=Math.imul(h^d[i],16777619);return h>>>0}
for(const trial of trials){try{const t=[0,.04,.6,2,3,4.4,6,8.8,10,11.96,12];const a=t.map(t=>pixels(trial.id,t));t.slice().reverse().forEach(t=>pixels(trial.id,t));const b=t.map(t=>pixels(trial.id,t));if(a.some((v,i)=>v!==b[i]))throw Error('random access changed pixels');output.deterministic.push(trial.id);output.rendered+=t.length*3}catch(e){output.errors.push({id:trial.id,message:String(e)})}}
const group=Math.max(0,Math.min(3,Number(new URLSearchParams(location.search).get('group'))||0));const root=document.querySelector('main');
for(const tr of trials.slice(group*4,group*4+4)){const heading=document.createElement('h2');heading.textContent=tr.id+' / '+tr.name;root.append(heading);const row=document.createElement('section');root.append(row);for(const t of [.6,4.4,8.8]){const box=document.createElement('div'),canvas=document.createElement('canvas');canvas.width=640;canvas.height=360;draw(canvas.getContext('2d'),t,640,360,{id:tr.id});box.append(canvas);const p=document.createElement('p');p.textContent=t.toFixed(1)+'s / '+sample(t).phase;box.append(p);row.append(box)}}
document.getElementById('diagnostics').textContent=JSON.stringify(output);document.getElementById('report').href=URL.createObjectURL(new Blob([JSON.stringify(output,null,2)],{type:'application/json'}));
</script></body></html>
